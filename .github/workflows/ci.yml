name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run check
      - run: bun scripts/size-check.ts
      - run: bun run typecheck
      - run: bun run docs:check
      - run: bun scripts/check-coverage.ts
        env:
          REPOTRUCK_TEST_RESULTS_DIR: test-results/unit
      - run: bun run build
      - name: Installed package, grammar and MCP smoke
        run: bun scripts/pack-smoke.ts
        env:
          REPOTRUCK_PACKAGE_RESULTS_DIR: test-results/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: test-results/
          retention-days: 14

  standalone:
    name: Standalone (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-standalone.ts
      - name: Package and test the native installer
        shell: bash
        env:
          STANDALONE_TARGET: ${{ matrix.target }}
        run: |
          version=$(node -p "require('./package.json').version")
          package=$(cat out/standalone/package-directory.txt)
          case "$STANDALONE_TARGET" in windows-*) extension=zip ;; *) extension=tar.gz ;; esac
          archive="out/archives/repotruck-$version-$STANDALONE_TARGET.$extension"
          python scripts/archive-standalone.py "$package" out/archives
          python -u scripts/test-standalone-install.py "$archive" "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.target }}
          path: |
            out/archives/*.tar.gz
            out/archives/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install
        working-directory: website
      - run: bun run build
        working-directory: website
      - run: bun run test:coverage
        working-directory: website
      - run: bunx playwright install --with-deps chromium
        working-directory: website
      - run: bun run test:browser
        working-directory: website
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-validation
          path: website/test-results/
          retention-days: 14

  minimum-headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.0.0, 22.0.0, 24.0.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/pack-smoke.ts
        env:
          REPOTRUCK_PACKAGE_RESULTS_DIR: test-results/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: node-${{ matrix.node }}-package
          path: test-results/

  minimum-tui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Select the minimum Bun runtime for the Bun matrix case
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify minimum Bun runtime
        if: matrix.runtime == 'bun'
        run: test "$(bun --version)" = "1.3.14"
      - name: Verify minimum Node runtime
        if: matrix.runtime == 'node'
        run: test "$(node --version)" = "v26.4.0"
      - run: bun test tests/hardening-processes.test.ts -t E62
        env:
          REPOTRUCK_TUI_TEST_RUNTIME: ${{ matrix.runtime }}
          REPOTRUCK_TUI_TEST_EXPECTED_VERSION: ${{ matrix.runtime == 'bun' && '1.3.14' || 'v26.4.0' }}
          REPOTRUCK_TUI_TEST_ENTRY: dist/cli.js
          REPOTRUCK_TUI_TEST_FLAGS: ${{ matrix.runtime == 'node' && '--experimental-ffi' || '' }}

  deterministic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Repeat with a reproducible random seed
        run: bun test tests/hardening-regressions.test.ts tests/hardening-storage.test.ts tests/hardening-tui.test.tsx --rerun-each=3 --randomize --seed=1337
      - run: bun scripts/test-mutations.ts
        env:
          REPOTRUCK_MUTATION_RESULTS_DIR: test-results/mutations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deterministic-and-mutation-evidence
          path: test-results/

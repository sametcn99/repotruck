name: Pages

# Deploys the landing page to GitHub Pages. The repository owner must enable
# Pages first (Settings > Pages > Source: GitHub Actions). Dormant until a
# push touches website/** on main/master or runs manually.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "website/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4

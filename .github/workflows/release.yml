name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Verify CHANGELOG contains entry for this version
        run: VERSION="$(node -p "require('./package.json').version")" && (grep -E "^## \[${VERSION}\]" CHANGELOG.md || grep -E "^## \[v${VERSION}\]" CHANGELOG.md)
      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run typecheck
      - run: bun test --parallel=1
      - run: bun run build
      - name: Pack and smoke-test the tarball
        run: |
          bun scripts/pack-smoke.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-*
          merge-multiple: true
          path: out/release
      - name: Verify the archive matrix and generate checksums
        run: python3 scripts/prepare-release.py out/release
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          published_sha=$(npm view "repotruck@${GITHUB_REF_NAME#v}" gitHead 2>/dev/null || true)
          if [[ -n "$published_sha" ]]; then
            test "$published_sha" = "$(git rev-parse HEAD)"
            exit
          fi
          EXTRA_ARGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_ARGS+=(--tag next)
          fi
          npm publish --provenance --access public "${EXTRA_ARGS[@]}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${args[@]}" \
              out/release/*.tar.gz out/release/*.zip out/release/SHA256SUMS \
              out/release/install.sh out/release/install.ps1
          fi
          curl -fsSL --retry 4 --retry-all-errors \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/SHA256SUMS" \
            | cmp - out/release/SHA256SUMS
      - name: Publish the stable Homebrew formula and Scoop manifest
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch --depth=1 origin main
          git switch -c publish-manifests FETCH_HEAD
          mkdir -p Formula bucket
          cp out/release/manifests/Formula/repotruck.rb Formula/
          cp out/release/manifests/bucket/repotruck.json bucket/
          git add Formula/repotruck.rb bucket/repotruck.json
          if ! git diff --cached --quiet; then
            git commit -m "Update install manifests for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

  public-install:
    name: Public install (${{ matrix.target }})
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: macos-x64, runner: macos-15-intel, manager: brew }
          - { target: macos-arm64, runner: macos-15, manager: brew }
          - { target: windows-x64, runner: windows-2025, manager: scoop }
          - { target: windows-arm64, runner: windows-11-arm, manager: scoop }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install from GitHub Releases
        shell: bash
        run: python -u scripts/test-standalone-install.py --public "${GITHUB_REF_NAME#v}"
      - name: Install from Homebrew
        if: matrix.manager == 'brew'
        run: |
          brew tap sametcn99/repotruck https://github.com/sametcn99/repotruck.git
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula sametcn99/repotruck/repotruck
          fi
          brew install sametcn99/repotruck/repotruck
          brew test sametcn99/repotruck/repotruck
          node scripts/smoke-installed.mjs --binary "$(brew --prefix)/bin/repotruck" "${GITHUB_REF_NAME#v}"
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Install from Scoop
        if: matrix.manager == 'scoop'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://get.scoop.sh))) -RunAsAdmin
          scoop bucket add repotruck https://github.com/sametcn99/repotruck.git
          if ($LASTEXITCODE -ne 0) { throw 'Scoop bucket setup failed' }
          scoop install repotruck/repotruck
          if ($LASTEXITCODE -ne 0) { throw 'Scoop install failed' }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ((repotruck --version) -cne $version) { throw 'Scoop shim version mismatch' }
          node scripts/smoke-installed.mjs --binary (Join-Path (scoop prefix repotruck) repotruck.exe) $version

  <circle cx="160" cy="232" r="7" fill="#30363d"/>
  <text x="184" y="238" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#484f58">repotruck — terminal</text>
  <line x1="80" y1="256" x2="1120" y2="256" stroke="#30363d" stroke-width="2"/>

  <text x="112" y="300" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#3fb950">$</text>
  <text x="140" y="300" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#c9d1d9">npx repotruck</text>

  <rect x="112" y="330" width="976" height="168" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="136" y="368" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#79c0ff">repotruck · monalisa (auth: gh-cli) · preset: categorized · 3 repos</text>
  <line x1="112" y1="386" x2="1088" y2="386" stroke="#30363d" stroke-width="1"/>

  <text x="136" y="420" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#484f58">SCOPE</text>

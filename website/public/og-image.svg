<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <text x="80" y="112" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="700" fill="#c9d1d9">repotruck</text>
  <text x="80" y="158" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#8b949e">Bulk-clone and organize your GitHub repositories</text>

  <rect x="80" y="200" width="1040" height="330" rx="10" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <circle cx="112" cy="232" r="7" fill="#30363d"/>

  <text x="840" y="478" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#39c5cf">[PULLING] monalisa/web</text>

  <rect x="80" y="470" width="260" height="44" rx="6" fill="#010409" stroke="#3fb950" stroke-width="2"/>
  <text x="104" y="499" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#3fb950">npx repotruck</text>


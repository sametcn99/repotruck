        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does repotruck authenticate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The GitHub CLI is preferred: run `gh auth login` once and repotruck picks up its token. Without gh, repotruck falls back to a cached device-flow token, or starts a device flow when REPOTRUCK_OAUTH_CLIENT_ID is set (an OAuth App client ID; no callback URL needed)."
            }
          },
          {
            "@type": "Question",
            "name": "Is my token safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tokens are never written into workspace files or .git/config. Clones and pulls use a one-shot credential header, the clone origin is reset to the clean HTTPS URL immediately, and failures print the first error line with the token redacted."
            }
          },
          {
            "@type": "Question",
            "name": "What is AGENTS.md for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is a machine-readable map of the workspace for coding agents: metadata (preset, last sync, counts), the internal/community split with relative paths, and agent rules (independent Git projects, search exclusions, community repos are read-only). It is rewritten on every sync, clone, move and create."
            }
          },
          {
            "@type": "Question",
            "name": "Can agents use repotruck directly?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. `repotruck mcp` runs a Model Context Protocol server on stdio that exposes the workspace as agent tools: list and search repositories, resolve owner/name or alias to an absolute path, read AGENTS.md, and run sync, clone, create, move and reorganize. Add it to Claude Code with `claude mcp add repotruck -- repotruck mcp`, or to any MCP client's mcpServers config with command `npx` and args [\"-y\", \"repotruck\", \"mcp\"]."
            }
          },
          {
            "@type": "Question",
            "name": "Does changing the preset move my repositories?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The preset affects new clones and creates only. To re-file existing repositories, run `repotruck reorganize <preset>` — preview it with --dry-run and spare manually placed repositories with --keep-custom."
            }
          },
          {
            "@type": "Question",
            "name": "What are the requirements?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The interactive dashboard needs Node.js >= 26.4 or Bun >= 1.3.14. The headless CLI commands run on Node.js >= 20. git must be on your PATH; the GitHub CLI is optional but is the easiest authentication path."
            }
          }
        ]

      <h1>Bulk-clone and organize your GitHub repositories</h1>
      <p>
        repotruck mirrors your GitHub repositories into predictable directory
        layouts (categorized, flat-by-owner, topic-focused), keeps them up to
        date, and writes an AGENTS.md map for AI coding agents. Requires
        Node.js 20+ for the headless CLI; the dashboard needs Node.js 26.4+ or
        Bun 1.3.14+.
      </p>
      <ul>
        <li>npx repotruck</li>
        <li>bunx repotruck</li>
        <li>npm i -g repotruck</li>
        <li>bun add -g repotruck</li>
      </ul>
      <p>
        MIT licensed. Enable JavaScript for the full page — the live terminal
        demo, feature grid, complete command reference with flags, settings,
        divergence strategies, keyboard shortcuts and FAQ. The essentials work
        from any shell: <code>repotruck sync</code>, <code>repotruck clone
        &lt;owner/name&gt;</code>, lifecycle via <code>forget</code>,
        <code>prune</code>, <code>delete</code>, <code>archive</code> and
        <code>status</code>, <code>repotruck reorganize &lt;preset&gt;</code>,
        <code>repotruck config set &lt;key&gt; &lt;value&gt;</code> and
        <code>repotruck mcp</code>.
      </p>
